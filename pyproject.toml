[project]
name = "baloto-ml"
version = "0.1.0"
description = "Experimento educativo: un pipeline de ML reproducible que busca (y no encuentra) señal en los sorteos del Baloto."
readme = "README.md"
authors = [{ name = "Ronaldo Duran" }]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "joblib>=1.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[project.scripts]
baloto-ml = "baloto_ml.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
notebooks = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
